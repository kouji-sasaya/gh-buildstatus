<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yocto buildstats bar chart race - 20261020142538</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #10141c; color: #e8edf5; }
    body { margin: 0; padding: 28px; }
    main { max-width: 1440px; margin: auto; }
    .title-row { display: flex; align-items: flex-start; gap: 12px 24px; flex-wrap: wrap; }
    .title-row h1 { margin-right: auto; }
    .speed-rows { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
    .speed { display: flex; align-items: center; gap: 4px; }
    .speed-label { color: #9eacc0; font-size: .8rem; margin-right: 4px; }
    .speed button { min-width: 52px; padding: 5px 8px; font-size: .8rem; background: #263448; }
    .speed button:hover { background: #33476a; }
    .speed button:disabled { opacity: .4; cursor: default; background: #263448; }
    .speed button[aria-pressed="true"] { background: #3b82f6; }
    h1 { margin: 0 0 6px; font-size: clamp(1.35rem, 3vw, 2rem); }
    .subhead, .meta { color: #9eacc0; }
    .meta { margin: 8px 0 20px; font-size: .9rem; }
    .chart-layout { display: grid; grid-template-columns: minmax(0, 1fr) 155px; gap: 10px; align-items: start; }
    .chart { min-width: 0; overflow: hidden; border: 1px solid #283244; border-radius: 14px; background: #151b26; }
    svg { display: block; width: 100%; height: auto; }
    .legend { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; margin: 0; padding: 8px 0 8px 10px; border-left: 1px solid #283244; color: #c5d0df; font-size: .72rem; line-height: 1.1; }
    .legend-title { color: #9eacc0; font-weight: 600; }
    .legend-actions { display: flex; flex-wrap: wrap; gap: 4px; }
    .legend-actions button { padding: 3px 6px; font-size: .7rem; background: #263448; }
    .legend-actions button:hover { background: #33476a; }
    .legend-item { display: inline-flex; align-items: center; gap: 5px; padding: 3px 5px; border: 1px solid transparent; border-radius: 5px; color: inherit; line-height: 1.1; cursor: pointer; }
    .legend-item:hover { border-color: #60738f; background: #222c3a; }
    .legend-item input { margin: 0; accent-color: #3b82f6; cursor: pointer; }
    .legend-swatch { flex: 0 0 10px; width: 10px; height: 10px; border-radius: 3px; }
    .grid { stroke: #2a3445; stroke-width: 1; }
    .axis-label { fill: #8f9db1; font-size: 13px; }
    .task-label { fill: #e8edf5; font-size: 11px; }
    .value-label { fill: #d8e1ed; font-size: 11px; font-variant-numeric: tabular-nums; }
    .bar { rx: 5; }
    .bar-row { transition: transform .22s ease, opacity .22s ease; }
    .controls { display: flex; align-items: center; gap: 14px; margin: 10px 0 4px; }
    .controls button { min-width: 96px; }
    .timeline-row { margin: 0 0 12px; }
    .timeline-row input[type=range] { display: block; width: 100%; }
    button { border: 0; border-radius: 8px; padding: 9px 15px; background: #3b82f6; color: white; font: inherit; cursor: pointer; }
    button:hover { background: #5594ff; }
    input[type=range] { flex: 1; min-width: 100px; height: 18px; margin: 0; appearance: none; background: transparent; cursor: pointer; }
    input[type=range]::-webkit-slider-runnable-track { height: 8px; border-radius: 999px; background: linear-gradient(to right, #60a5fa var(--progress), #2a3445 var(--progress)); }
    input[type=range]::-moz-range-track { height: 8px; border-radius: 999px; background: #2a3445; }
    input[type=range]::-moz-range-progress { height: 8px; border-radius: 999px; background: #60a5fa; }
    input[type=range]::-webkit-slider-thumb { width: 16px; height: 16px; margin-top: -4px; appearance: none; border: 2px solid #e8edf5; border-radius: 50%; background: #3b82f6; }
    input[type=range]::-moz-range-thumb { width: 12px; height: 12px; border: 2px solid #e8edf5; border-radius: 50%; background: #3b82f6; }
    .clock { text-align: left; font-variant-numeric: tabular-nums; color: #c5d0df; }
    .note { color: #9eacc0; font-size: .9rem; line-height: 1.55; }
    .metrics { display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; margin-bottom: 12px; }
    .metric { min-width: 0; padding: 4px 0 2px; border: 1px solid #283244; border-radius: 10px; background: #151b26; }
    .metric-head { display: flex; align-items: baseline; gap: 16px; padding: 0 10px; }
    .metric h2 { margin: 0; font-size: .8rem; color: #c5d0df; white-space: nowrap; }
    .metric-readout { display: flex; flex-wrap: wrap; gap: 4px 12px; color: #c5d0df; font-size: .72rem; font-variant-numeric: tabular-nums; }
    .metric-readout i { display: inline-block; width: 9px; height: 9px; margin-right: 4px; border-radius: 2px; }
    .metric .tick { fill: #8f9db1; font-size: 10px; }
    .metric .cursor { stroke: #e8edf5; stroke-width: 1; stroke-dasharray: 3 3; }
    @media (max-width: 800px) { .metrics { grid-template-columns: minmax(0, 1fr); } }
    @media (max-width: 800px) {
      .chart-layout { grid-template-columns: minmax(0, 1fr); }
      .legend { flex-direction: row; flex-wrap: wrap; padding: 10px; border-left: 0; border-top: 1px solid #283244; }
    }
    @media (max-width: 650px) {
      body { padding: 16px; }
      .controls { gap: 10px; }
      .task-label { font-size: 10px; }
    }
  </style>
</head>
<body>
<main>
  <div class="title-row">
    <h1>Yocto ビルド: 個別タスク時間レース</h1>
    <div class="speed-rows">
      <div class="speed" role="group" aria-label="グラフの縦サイズ">
        <span class="speed-label">拡大</span>
        <button type="button" data-zoom="0.25">x0.25</button>
        <button type="button" data-zoom="0.5">x0.5</button>
        <button type="button" data-zoom="1" aria-pressed="true">x1</button>
        <button type="button" data-zoom="2">x2</button>
        <button type="button" data-zoom="4">x4</button>
        <button type="button" data-zoom="8">x8</button>
      </div>
      <div class="speed" role="group" aria-label="再生速度">
        <span class="speed-label">速度</span>
        <button type="button" data-speed="0.25">x0.25</button>
        <button type="button" data-speed="0.5">x0.5</button>
        <button type="button" data-speed="1" aria-pressed="true">x1</button>
        <button type="button" data-speed="2">x2</button>
        <button type="button" data-speed="4">x4</button>
        <button type="button" data-speed="8">x8</button>
      </div>
    </div>
  </div>
  <div class="meta" id="meta"></div>
  <div class="controls">
    <button id="toggle" type="button">再生</button>
    <div class="clock" id="clock"></div>
  </div>
  <div class="timeline-row">
    <input id="timeline" type="range" min="0" step="any" value="0" aria-label="ビルド経過時間">
  </div>
  <section class="metrics" id="metrics" aria-label="ホストのリソース使用状況"></section>
  <div class="chart-layout">
    <div class="chart">
      <svg id="chart" viewBox="0 0 1100 650" role="img" aria-label="個別タスク実行時間のバーチャートレース"></svg>
    </div>
    <div class="legend" id="legend" aria-label="タスク種別の色凡例">
      <span class="legend-title">タスク種別:</span>
    </div>
  </div>
</main>
<script>
const dataBase = `buildstatus/${new URLSearchParams(location.search).get("target") || "raspberry"}/`;
function fetchJson(url) {
  return fetch(url).then(response => {
    if (!response.ok) {
      throw new Error(`データ読み込み失敗: ${url} HTTP ${response.status}`);
    }
    return response.json();
  });
}
fetchJson(`${dataBase}bar_chart_race.json`)
  .catch(() => fetchJson("bar_chart_race.json"))
  .then(DATA => {
const events = DATA.events;
const duration = DATA.metadata.duration;
const taskTypes = [...new Set(events.map(event => event.task))].sort();
const taskColors = new Map(taskTypes.map((task, index) => [
  task,
  `hsl(${taskTypes.length > 1 ? index * 300 / (taskTypes.length - 1) : 0} 72% 58%)`
]));
const finalTotals = new Map();
const taskByKey = new Map();
for (const event of events) {
  const key = taskKey(event);
  finalTotals.set(key, event.duration);
  taskByKey.set(key, event);
}
const axisMax = Math.max(1, ...finalTotals.values());
const svg = document.getElementById("chart");
const slider = document.getElementById("timeline");
const toggle = document.getElementById("toggle");
const clock = document.getElementById("clock");
const maxBars = 100;
const plot = { left: 330, top: 53, width: 680, row: 16 };
const chartHeight = plot.top + maxBars * plot.row + 30;
const ns = "http://www.w3.org/2000/svg";
const enabledTasks = new Set(taskTypes);
svg.setAttribute("viewBox", `0 0 1100 ${chartHeight}`);
slider.max = String(duration);
const gridLayer = el("g", {});
const barsLayer = el("g", {});
const axisLabels = [];
const barRows = new Map();
for (let i = 0; i < 5; i++) {
  const x = plot.left + (plot.width * i) / 4;
  gridLayer.append(el("line", { x1: x, y1: 42, x2: x, y2: chartHeight - 20, class: "grid" }));
  const label = el("text", { x, y: 32, "text-anchor": "middle", class: "axis-label" }, "0 秒");
  axisLabels.push(label);
  gridLayer.append(label);
}
svg.append(gridLayer, barsLayer);

const statusSummary = Object.entries(DATA.metadata.statusCounts)
  .map(([status, count]) => `${status} ${count}`).join(" / ");
document.getElementById("meta").textContent =
  `${DATA.metadata.taskCount.toLocaleString()} タスクを集計` +
  (DATA.metadata.skippedCount ? `（記録なし ${DATA.metadata.skippedCount.toLocaleString()} 件を除外）` : "") +
  (statusSummary ? ` ・ ${statusSummary}` : "");

function formatTime(seconds) {
  const value = Math.max(0, Math.floor(seconds));
  const hours = Math.floor(value / 3600);
  const minutes = Math.floor((value % 3600) / 60);
  const secs = value % 60;
  return `${String(hours).padStart(2, "0")}:${String(minutes).padStart(2, "0")}:${String(secs).padStart(2, "0")}`;
}

function colorFor(name) {
  return taskColors.get(name);
}

function taskKey(event) {
  return `${event.recipeId}/${event.task}`;
}

function el(tag, attrs, text) {
  const node = document.createElementNS(ns, tag);
  for (const [key, value] of Object.entries(attrs)) node.setAttribute(key, value);
  if (text !== undefined) node.textContent = text;
  return node;
}

const legend = document.getElementById("legend");
const legendChecks = new Map();
function setAllTasks(checked) {
  for (const [task, box] of legendChecks) {
    box.checked = checked;
    enabledTasks[checked ? "add" : "delete"](task);
  }
  draw(Number(slider.value));
}
const legendActions = document.createElement("div");
legendActions.className = "legend-actions";
for (const [text, checked] of [["すべて選択", true], ["すべて解除", false]]) {
  const action = document.createElement("button");
  action.type = "button";
  action.textContent = text;
  action.addEventListener("click", () => setAllTasks(checked));
  legendActions.append(action);
}
legend.append(legendActions);
for (const task of taskTypes) {
  const item = document.createElement("label");
  item.className = "legend-item";
  const box = document.createElement("input");
  box.type = "checkbox";
  box.checked = true;
  box.addEventListener("change", () => {
    enabledTasks[box.checked ? "add" : "delete"](task);
    draw(Number(slider.value));
  });
  legendChecks.set(task, box);
  const swatch = document.createElement("span");
  swatch.className = "legend-swatch";
  swatch.style.backgroundColor = colorFor(task);
  item.append(box, swatch, document.createTextNode(task));
  legend.append(item);
}

function draw(time) {
  const totals = new Map();
  for (const event of events) {
    let contribution = 0;
    if (time >= event.time) {
      contribution = event.duration;
    } else if (time > event.startTime && event.time > event.startTime) {
      contribution = event.duration * (time - event.startTime) / (event.time - event.startTime);
    }
    if (contribution > 0 && enabledTasks.has(event.task)) {
      totals.set(taskKey(event), contribution);
    }
  }
  const leaders = [...totals].sort((a, b) => b[1] - a[1]).slice(0, maxBars);
  for (let i = 0; i < 5; i++) {
    axisLabels[i].textContent = `${((axisMax * i) / 4).toFixed(0)} 秒`;
  }
  const visibleTasks = new Set(leaders.map(([key]) => key));
  for (const [key, row] of barRows) {
    if (!visibleTasks.has(key)) row.group.setAttribute("opacity", "0");
  }
  leaders.forEach(([key, value], index) => {
    const event = taskByKey.get(key);
    if (!event) throw new Error(`タスク情報が見つかりません: ${key}`);
    const y = plot.top + index * plot.row;
    const width = (value / axisMax) * plot.width;
    let row = barRows.get(key);
    if (!row) {
      const group = el("g", { class: "bar-row", opacity: "0" });
      const fullLabel = `${event.task} · ${event.recipe}`;
      const labelText = fullLabel.length > 48 ? `${fullLabel.slice(0, 47)}…` : fullLabel;
      const label = el("text", { x: plot.left - 12, y: 11, "text-anchor": "end", class: "task-label" }, labelText);
      label.append(el("title", {}, `${event.recipeId} / ${event.task}`));
      const bar = el("rect", { x: plot.left, y: 0, width: 0, height: 11, fill: colorFor(event.task), class: "bar" });
      const amount = el("text", { x: plot.left + 9, y: 11, class: "value-label" }, "");
      group.append(label, bar, amount);
      barsLayer.append(group);
      row = { group, bar, label, amount, task: event.task };
      barRows.set(key, row);
    }
    row.group.setAttribute("transform", `translate(0 ${y})`);
    row.group.setAttribute("opacity", "1");
    row.bar.setAttribute("width", String(width));
    row.amount.setAttribute("x", String(plot.left + width + 9));
    row.amount.textContent = `${value.toFixed(1)} 秒`;
  });
  clock.textContent = `ビルド経過 ${formatTime(time)} / ${formatTime(duration)}`;
  slider.value = String(time);
  slider.style.setProperty("--progress", `${(time / duration) * 100}%`);
  metricCharts.forEach(chart => chart.update(time));
  updateToggleLabel();
}

const metricCharts = [];
const metricSpecs = [];
let metricZoom = 1;
function metricChart(spec) {
  const W = 1400, m = { l: 0, r: 0, t: 4, b: 14 };
  const pw = W - m.l - m.r, ph = 44 * metricZoom, H = ph + m.t + m.b;
  const host = document.createElement("div");
  host.className = "metric";
  const title = document.createElement("h2");
  title.textContent = `${spec.title} (${spec.unit})`;
  const readout = document.createElement("div");
  readout.className = "metric-readout";
  const box = el("svg", { viewBox: `0 0 ${W} ${H}` });
  box.style.overflow = "visible";
  const head = document.createElement("div");
  head.className = "metric-head";
  head.append(title, readout);
  host.append(head, box);
  document.getElementById("metrics").append(host);

  const dt = spec.dt;
  const count = spec.series[0].values.length;
  let tops = spec.series.map(s => s.values);
  if (spec.stacked) {
    const acc = [];
    tops = tops.map(values => values.map((v, i) => {
      acc[i] = (acc[i] || 0) + (v ?? 0);
      return acc[i];
    }));
  }
  const dataMax = Math.max(0, ...tops.flat().filter(v => v !== null));
  const yMax = spec.yMax ?? (dataMax > 0 ? dataMax * 1.1 : 1);
  const x = t => m.l + Math.min(1, t / duration) * pw;
  const y = v => m.t + ph - (Math.max(0, v) / yMax) * ph;
  for (let i = 0; i <= 2; i++) {
    const gy = m.t + (ph * i) / 2;
    box.append(el("line", { x1: m.l, x2: W - m.r, y1: gy, y2: gy, class: "grid" }));
    box.append(el("text", { x: m.l + 3, y: gy + (i === 0 ? 10 : i === 2 ? -3 : 3), class: "tick" },
      (yMax * (2 - i) / 2).toFixed(yMax >= 10 ? 0 : 1)));
  }
  const steps = [60, 300, 600, 900, 1800, 3600];
  const vStep = steps.find(step => duration / step <= 12) ?? 3600;
  for (let t = 0; t <= duration; t += vStep) {
    box.append(el("line", { x1: x(t), x2: x(t), y1: m.t, y2: m.t + ph, class: "grid" }));
    box.append(el("text", { x: x(t), y: H - 3, "text-anchor": t === 0 ? "start" : "middle", class: "tick" }, formatTime(t)));
  }

  const paths = spec.series.map(s => {
    const path = spec.stacked
      ? el("path", { fill: s.color, opacity: "0.85" })
      : el("path", { fill: "none", stroke: s.color, "stroke-width": "1.5" });
    box.append(path);
    return path;
  });
  const cursor = el("line", { y1: m.t, y2: m.t + ph, class: "cursor" });
  box.append(cursor);

  const fields = spec.series.map(s => {
    const item = document.createElement("span");
    const swatch = document.createElement("i");
    swatch.style.backgroundColor = s.color;
    const text = document.createTextNode("");
    item.append(swatch, text);
    readout.append(item);
    return text;
  });

  metricCharts.push({ host, box, update: time => {
    const cur = Math.max(0, Math.min(count - 1, Math.floor(time / dt)));
    const times = [];
    const idx = [];
    for (let i = 0; i <= cur; i++) {
      const t = (i + 0.5) * dt;
      if (t > time) break;
      times.push(t);
      idx.push(i);
    }
    times.push(time);
    idx.push(cur);

    spec.series.forEach((s, k) => {
      let d = "";
      if (spec.stacked) {
        const lower = k ? tops[k - 1] : null;
        const up = idx.map((i, n) => `${n ? "L" : "M"}${x(times[n]).toFixed(1)} ${y(tops[k][i]).toFixed(1)}`);
        const down = idx.map((i, n) => `L${x(times[n]).toFixed(1)} ${y(lower ? lower[i] : 0).toFixed(1)}`).reverse();
        d = up.join("") + down.join("") + "Z";
      } else {
        let pen = false;
        idx.forEach((i, n) => {
          const v = s.values[i];
          if (v === null) { pen = false; return; }
          d += `${pen ? "L" : "M"}${x(times[n]).toFixed(1)} ${y(v).toFixed(1)}`;
          pen = true;
        });
      }
      paths[k].setAttribute("d", d);
      const v = s.values[cur];
      fields[k].textContent = `${s.name} ${v === null || v === undefined ? "-" : v.toFixed(spec.digits ?? 1)}`;
    });
    cursor.setAttribute("x1", x(time).toFixed(1));
    cursor.setAttribute("x2", x(time).toFixed(1));
  } });
}

// Align each chart's time axis with the slider thumb's travel range.
function alignMetrics() {
  const thumbRadius = 8;
  const sliderRect = slider.getBoundingClientRect();
  for (const { host, box } of metricCharts) {
    const rect = host.getBoundingClientRect();
    const style = getComputedStyle(host);
    const contentLeft = rect.left + host.clientLeft + parseFloat(style.paddingLeft);
    const contentRight = rect.right - host.clientLeft - parseFloat(style.paddingRight);
    const left = Math.max(0, sliderRect.left + thumbRadius - contentLeft);
    const right = Math.min(contentRight - contentLeft, sliderRect.right - thumbRadius - contentLeft);
    box.style.marginLeft = `${left}px`;
    box.style.width = `${Math.max(1, right - left)}px`;
  }
}
window.addEventListener("resize", alignMetrics);

function seriesOf(block) {
  return block && block.series ? { dt: block.dt, series: block.series } : null;
}

async function loadMetrics() {
  const load = name => fetchJson(`${dataBase}${name}.json`).catch(() => null);
  const [cpu, memory, disk] = await Promise.all([load("cpu"), load("memory"), load("disk")]);
  const scale = (values, f) => values.map(v => (v === null ? null : f(v)));
  const palette = ["#60a5fa", "#f59e0b", "#ef4444", "#34d399", "#a78bfa"];

  const usage = seriesOf(cpu && cpu.usage);
  if (usage) {
    metricSpecs.push({ title: "CPU 使用率", unit: "%", dt: usage.dt, stacked: true, yMax: 100,
      series: ["user", "system", "iowait"].map((name, i) => ({ name, color: palette[i], values: usage.series[name] })) });
  }

  const mem = seriesOf(memory && memory.meminfo);
  if (mem) {
    const s = mem.series;
    const GB = 1048576;
    const used = s.total_kb.map((t, i) => [t, s.free_kb[i], s.buffers_kb[i], s.cached_kb[i]].includes(null)
      ? null : (t - s.free_kb[i] - s.buffers_kb[i] - s.cached_kb[i]) / GB);
    const swap = s.swap_total_kb.map((t, i) => (t === null || s.swap_free_kb[i] === null ? null : (t - s.swap_free_kb[i]) / GB));
    metricSpecs.push({ title: "メモリ", unit: "GiB", dt: mem.dt, digits: 2, series: [
      { name: "使用", color: palette[0], values: used },
      { name: "キャッシュ", color: palette[3], values: scale(s.cached_kb, v => v / GB) },
      { name: "swap使用", color: palette[2], values: swap },
    ] });
  }

  const free = disk && disk.free ? Object.entries(disk.free).filter(([, b]) => b && b.series) : [];
  if (free.length) {
    metricSpecs.push({ title: "ディスク空き容量", unit: "GiB", dt: free[0][1].dt, digits: 1,
      series: free.map(([dev, b], i) => ({ name: dev, color: palette[i % palette.length], values: scale(b.series.free_bytes, v => v / 2 ** 30) })) });
  }

  const pressure = [["cpu", cpu && cpu.pressure], ["memory", memory && memory.pressure], ["io", disk && disk.pressure]]
    .filter(([, p]) => seriesOf(p));
  if (pressure.length) {
    metricSpecs.push({ title: "資源競合: CPU / メモリ / I/O 待ち", unit: "%", dt: pressure[0][1].dt, digits: 1,
      series: pressure.map(([name, p], i) => ({ name, color: palette[i], values: p.series.avg10 })) });
  }
  renderMetrics();
}

function renderMetrics() {
  document.getElementById("metrics").replaceChildren();
  metricCharts.length = 0;
  metricSpecs.forEach(metricChart);
  alignMetrics();
  metricCharts.forEach(chart => chart.update(Number(slider.value)));
}
for (const button of document.querySelectorAll(".speed button[data-zoom]")) {
  button.addEventListener("click", () => {
    metricZoom = Number(button.dataset.zoom);
    for (const other of document.querySelectorAll(".speed button[data-zoom]")) {
      other.setAttribute("aria-pressed", String(other === button));
    }
    renderMetrics();
  });
}

let playing = false;
let animation;
let previousFrame = 0;
const baseRate = duration / 45;
let speed = 1;
for (const button of document.querySelectorAll(".speed button[data-speed]")) {
  button.addEventListener("click", () => {
    speed = Number(button.dataset.speed);
    for (const other of document.querySelectorAll(".speed button[data-speed]")) {
      other.setAttribute("aria-pressed", String(other === button));
    }
  });
}
function updateToggleLabel() {
  toggle.textContent = playing ? "一時停止" : Number(slider.value) >= duration ? "リスタート" : "再生";
}
function frame(now) {
  if (!playing) return;
  if (!previousFrame) previousFrame = now;
  const next = Number(slider.value) + ((now - previousFrame) / 1000) * baseRate * speed;
  previousFrame = now;
  if (next >= duration) {
    setPlaying(false);
    draw(duration);
    return;
  }
  draw(next);
  animation = requestAnimationFrame(frame);
}
function setPlaying(value) {
  playing = value;
  updateToggleLabel();
  previousFrame = 0;
  if (playing) animation = requestAnimationFrame(frame);
  else if (animation) cancelAnimationFrame(animation);
}
toggle.addEventListener("click", () => {
  if (playing) {
    setPlaying(false);
    return;
  }
  if (Number(slider.value) >= duration) draw(0);
  setPlaying(true);
});
slider.addEventListener("input", () => {
  if (playing) setPlaying(false);
  draw(Number(slider.value));
});
draw(0);
loadMetrics().catch(error => console.error("メトリクスの読み込みに失敗しました:", error));
  })
  .catch(error => {
    console.error("バーチャートレースのデータ読み込みに失敗しました:", error);
    document.getElementById("meta").textContent =
      "グラフデータを読み込めません。HTTPサーバー経由で開き、JSONファイルを確認してください。";
  });
</script>
</body>
